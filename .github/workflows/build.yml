name: Build Ultra-Light SafeGuardShield EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UPX
        run: choco install upx -y

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mss numpy onnxruntime pyinstaller

      - name: Build ultra-light single EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name "SafeGuardShield" `
            --upx-dir "C:\ProgramData\chocolatey\bin" `
            --collect-binaries onnxruntime `
            --exclude-module onnxruntime.quantization `
            --exclude-module onnxruntime.transformers `
            --exclude-module onnxruntime.tools `
            --exclude-module onnxruntime.training `
            --exclude-module PIL `
            --exclude-module pystray `
            --exclude-module cv2 `
            --exclude-module PyQt6 `
            --exclude-module PyQt5 `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exclude-module sqlite3 `
            --exclude-module multiprocessing `
            --exclude-module xmlrpc `
            --exclude-module pdb `
            --exclude-module doctest `
            --exclude-module lib2to3 `
            --exclude-module test `
            --exclude-module distutils `
            --exclude-module turtle `
            --exclude-module turtledemo `
            --exclude-module idlelib `
            safeguard_shield.py

      - name: Print final EXE size
        shell: pwsh
        run: |
          $sizeMB = [math]::Round((Get-Item "dist\SafeGuardShield.exe").Length / 1MB, 2)
          Write-Host "Final EXE Size: $sizeMB MB"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeGuardShield-UltraLight-EXE
          path: dist/SafeGuardShield.exe
