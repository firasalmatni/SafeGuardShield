name: Build SafeGuardShield EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 mss opencv-python numpy nudenet pyinstaller

      - name: Verify AI model inside NudeNet
        run: python -c "from nudenet import NudeDetector; NudeDetector()"

      - name: Build single EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "SafeGuardShield" --collect-all nudenet --collect-all onnxruntime safeguard_shield.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeGuardShield-EXE
          path: dist/SafeGuardShield.exe
