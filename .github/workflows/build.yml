name: Build SafeGuardShield Lightweight EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UPX for maximum size compression
        run: choco install upx -y

      - name: Install lightweight dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install mss numpy pillow onnxruntime pystray pyinstaller

      - name: Build ultra-light single EXE (with UAC Admin elevation)
        run: |
          pyinstaller --noconfirm --onefile --windowed --uac-admin `
            --name "SafeGuardShield" `
            --upx-dir "C:\ProgramData\chocolatey\bin" `
            --collect-binaries onnxruntime `
            --hidden-import pystray._win32 `
            --hidden-import PIL._tkinter_finder `
            --exclude-module PyQt6 `
            --exclude-module PyQt5 `
            --exclude-module cv2 `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module unittest `
            --exclude-module pydoc `
            safeguard_shield.py

      - name: Check final EXE size
        shell: pwsh
        run: |
          $sizeMB = [math]::Round((Get-Item "dist\SafeGuardShield.exe").Length / 1MB, 2)
          Write-Host "Final EXE Size: $sizeMB MB"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeGuardShield-Lightweight-EXE
          path: dist/SafeGuardShield.exe
